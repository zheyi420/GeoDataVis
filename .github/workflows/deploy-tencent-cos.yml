name: Deploy to Tencent Cloud COS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Tencent COS
        run: pnpm run build:tencent-cos

      # 新增：配置 Python 环境（coscmd 依赖 Python）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 替换：使用腾讯云官方底层 COSCMD 命令行工具进行同步与清理
      - name: Deploy to Tencent Cloud COS via COSCMD
        run: |
          # 1. 安装官方命令行工具
          pip install coscmd
          
          # 2. 注入密钥与存储桶配置
          coscmd config -a ${{ secrets.TENCENT_SECRET_ID }} -s ${{ secrets.TENCENT_SECRET_KEY }} -b ${{ secrets.COS_BUCKET }} -r ${{ secrets.COS_REGION }}
          
          # 3. 执行严格增量同步并彻底删除云端多余旧文件 (-r 递归, -s 跳过相同文件, --delete 同步删除)
          coscmd upload -rs --delete -y dist/tencent-cos/ /