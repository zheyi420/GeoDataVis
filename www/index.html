<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GeoDataVis" />
    <title>GeoDataVis</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a2332;
        --text: #e8ecf1;
        --muted: #9aa5b5;
        --accent-hover: #60a5fa;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        display: flex;
        flex-direction: column;
      }

      .wrap {
        flex: 1;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 6rem;
      }

      header {
        margin-bottom: 0;
      }

      h1 {
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
      }

      .lead {
        font-size: 1.05rem;
        color: var(--muted);
        margin: 0;
      }

      footer {
        margin-top: auto;
        padding: 1.25rem;
        text-align: center;
        font-size: 0.82rem;
        color: var(--muted);
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      footer a {
        color: var(--muted);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>GeoDataVis</h1>
        <!-- <p class="lead">敬请期待...</p> -->
      </header>
    </div>

    <footer>
      <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">粤ICP备2026031216号</a>
    </footer>
  </body>
</html>
